services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: mi-udyojak-backend
    restart: unless-stopped
    ports:
      - "${PORT:-5000}:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - MONGODB_URI=mongodb://mongo:27017/mi-udyojak-honarach
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:5173}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-http://localhost:5173}
      - ADMIN_EMAIL=${ADMIN_EMAIL:-miudyojakhonarch@gmail.com}
      - EMAIL_FROM=${EMAIL_FROM:-"Mi Udyojak Honarach <miudyojakhonarch@gmail.com>"}
      - ADMIN_API_KEY=${ADMIN_API_KEY:-}
      - SMTP_SERVICE=${SMTP_SERVICE:-}
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASS=${SMTP_PASS:-}
    depends_on:
      mongo:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5000/api/health/live"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - mi-udyojak-net

  mongo:
    image: mongo:7-jammy
    container_name: mi-udyojak-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - mi-udyojak-net

volumes:
  mongo-data:
    driver: local

networks:
  mi-udyojak-net:
    driver: bridge
